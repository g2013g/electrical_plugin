# Reproducible builds AND a loadable DLL.
#
# Rustc parity is NO LONGER gate-required: at plugin API >= 14 the host matches
# plugins by wire schema (codec types' serde shapes) instead of compiler or
# codec commit (`version_info::uses_acadrust_gate` skips 4..13-style checks).
# Any current stable can build the DLL as long as it compiles the checkout's
# ocs_plugin_api. (For reference, the v2026.44.0 host release was itself built
# with rustc 1.99.1.)
#
# The channel is deliberately left floating so a build never needs to download
# a toolchain.
[toolchain]
channel = "stable"
