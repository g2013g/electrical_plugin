# Deployed beside the plugin binary in
#   <config>/OpenCADStudio/plugins/opencad.electrical/
# Target host: Open CAD Studio v2026.46 (plugin API 23).
#
# Load-gate contract (host `src/plugin/external.rs` →
# `version_info::uses_acadrust_gate`):
#   API 4..13 plugins are fingerprint-gated: `[opencad] rustc_version` must
#   match the host's compiler token-for-token, and `acadrust_source` must name
#   the host's codec commit.
#   API >= 14 plugins (this one) run their own runner loop (`ocs_plugin_run`,
#   emitted by `export_plugin!`) and are matched by WIRE SCHEMA instead — the
#   FNV-1a hash of the codec types' serde shapes (`version_info::wire_schema`).
#   The host passes its hash via the OCS_WIRE_SCHEMA env var and the plugin's
#   runner refuses a mismatch ("plugin reads codec types of wire schema …,
#   but the host writes …; rebuild the plugin against this host's
#   ocs_plugin_api"). Equal wire schema is guaranteed by building against a
#   checkout of the host's own release tag: the codec graph resolved there
#   (opencaddocument@ae40a59 → acadrust 0.6.8@f946e8d, all immutable revs) is
#   what the release host was built with, so NO rustc/codec declarations are
#   needed in this file any more.
#
# Host v2026.46 embeds this record (extracted from the installed
# C:\Program Files\Open CAD Studio exe, 2026-11-16):
#   api_version        23         (min supported 3)
#   acadrust_version   0.6.8
#   acadrust_source    git+https://github.com/hakanaktt/acadrust.git?rev=f946e8d
#                      (full hash in the tag's Cargo.lock: f946e8d0c15508c4581b228a1efe44c18dc96234)
#   rustc_version      rustc 1.100.0 (0ef1bc386 2026-11-09)
#
# API 13→14 (v2026.44) surface: additive — self-hosted runner
# (ocs_plugin_run), parametric chains, plugin-scoped entity classes with a
# properties panel, CustomGripResponse.descriptor, query_entities pagination,
# PanelAction notification. Renames: codec type CadDocument → Document
# (CadDocumentReader keeps its name); the drawing database moved onto the
# shared OpenCADDocument model (IFCX open/save).
# API 14→15 (v2026.45) surface: additive — quad panels + custom icons
# (QuadPanelDef / RegisterQuadPanels / HostNotification::QuadAction with a
# default no-op on_quad_action on the plugin trait).
# API 15→23 (v2026.46) surface: additive throughout — reactive dialogs (v17),
# dock-panel snapshots (v18), styled text/SVG dialog controls (v19),
# selectable custom entity facades (v20), XY-plane grip constraint (v21),
# geo location + SelectionChangedDigest + panel_action op (v22), layout tab
# order (v23). No routing change affects this plugin (it consumes no
# selection notifications); wire_schema unchanged by design. Upstream main is
# already past this, so the pristine checkout tracks the v2026.46
# tag (8b4d270), NOT upstream HEAD.

[plugin]
id = "opencad.electrical"
name = "Electrical"
version = "0.1.9"
description = "Electrical control-schematic design: ladders and line references, wire numbering, component tagging and cross-references, terminals, cables, reports and audit."
author = "electrical plugin contributors"
license = "GPL-3.0-only"

[opencad]
api_version = 23
ribbon_order = 70
command_prefixes = ["EL_"]
xdata_apps = ["OCSEL"]
